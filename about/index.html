<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Izzy Kelly</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html { scroll-snap-type: none !important; }
    footer { scroll-snap-align: none; }
  </style>
</head>
<body>

  <!-- NAV -->
  <div id="site-nav"></div>

  <!-- ABOUT -->
  <main class="about-page">

    <div class="about-left">
      <h1 class="about-heading">About me</h1>
      <p class="about-body" id="about-bio"></p>

      <div class="about-embeds">
        <div class="embed-block embed-spotify" id="spotify-embed" hidden>
          <h2 class="embed-subtitle">some of my music</h2>
          <div class="embed-wrap">
            <iframe src="" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify playlist"></iframe>
          </div>
        </div>
        <div class="embed-block embed-instagram" id="instagram-embed" hidden>
          <h2 class="embed-subtitle">my fiber arts endeavors</h2>
          <div class="embed-wrap">
            <iframe src="" scrolling="no" allowtransparency="true" class="lightwidget-widget" style="width:100%;border:0;overflow:hidden;" loading="lazy" title="Instagram feed"></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="about-right">
      <div class="about-photo-wrap">
        <img class="about-photo" src="assets/me_image.png" alt="Izzy Kelly" />
        <img class="about-frame" src="assets/about-me-frame.png" alt="" aria-hidden="true" />
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <img id="character" src="assets/Dr._Booger_-_Walking-transparent.gif" alt="Dr Booger" />
  <script src="character.js"></script>
  <script src="https://cdn.lightwidget.com/widgets/lightwidget.js"></script>
  <script src="about/about.js"></script>
  <script src="nav.js"></script>
  <script src="footer.js"></script>

</body>
</html>
