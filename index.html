<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izzy Kelly</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>document.documentElement.style.overflow = 'hidden';</script>
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <span id="loader-text"></span><span id="loader-cursor">|</span>
  </div>

  <!-- NAV -->
  <div id="site-nav"></div>

  <!-- HERO -->
  <section id="home">
    <h1 class="hero-heading">
      I'm Izzy, a
      <span class="word-frame-wrap">
      <span class="word-rotator" aria-label="visual">
        <span class="word-track">
          <span>visual</span>
          <span>ux/ui</span>
          <span>print</span>
          <span aria-hidden="true">visual</span>
        </span>
      </span>
      </span>
      designer.
    </h1>
    <p class="hero-subtext">
      Jack of all trades, master of some. Designing digital and print experiences focusing on usability, accessibility, and visual storytelling.
    </p>

    <div class="scroll-signal">
      <div class="scroll-arrow">
        <img src="assets/arrow.png" alt="" />
      </div>
    </div>
  </section>

  <!-- WORK -->
  <section id="work">
    <div class="work-sidebar">
      <p class="section-label">SELECTED WORK</p>
      <h2 class="section-heading">Projects</h2>
    </div>

    <div class="projects-grid"></div>
  </section>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <img id="character" src="assets/Dr._Booger_-_Walking-transparent.gif" alt="Dr Booger" />
  <script src="loader.js"></script>
  <script src="character.js"></script>
  <script src="sanity.js"></script>
  <script src="nav.js"></script>
  <script src="footer.js"></script>
</body>
</html>
